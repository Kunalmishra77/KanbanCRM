<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f26b21" />
    <title>Offline - AGENTiX CRM</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fff7f2;
        color: #0f1c2e;
        text-align: center;
      }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #4b5563; max-width: 320px; }
      button {
        background: #f26b21;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="AGENTiX" />
      <h1>You're offline</h1>
      <p>AGENTiX CRM needs a connection to load your latest data. Check your network and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
